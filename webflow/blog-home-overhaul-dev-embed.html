<style>
  /* Keep selected filters on the same color palette as their hover state. */
  .blog-sort_filters.is-active {
    border-color: var(--base-color-brand--epm-red);
    background-color: var(--base-color-brand--epm-red);
    color: var(--text-color--text-alternate);
  }

  .blog-sort_filters.topic.is-active {
    border-color: var(--base-color-brand--cloud-red);
    background-color: var(--base-color-brand--cloud-red);
  }

  .blog-sort_filters.is-content.is-active {
    border-color: var(--base-color-neutral--neutral-dark);
    background-color: var(--base-color-neutral--neutral-dark);
  }

  /* Reserve the first result row while the index loads to prevent layout shift. */
  .static-resource-library_skeleton {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 2rem;
    min-height: 34rem;
  }

  .static-resource-library_skeleton-card {
    min-height: 32rem;
    border-radius: 0.5rem;
    background: linear-gradient(110deg, #eeeeee 8%, #f7f7f7 18%, #eeeeee 33%);
    background-size: 200% 100%;
    animation: resource-skeleton 1.4s linear infinite;
  }

  .static-resource-library_search {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    margin-bottom: 1.5rem;
  }

  .static-resource-library_search input {
    width: min(100%, 36rem);
    min-height: 3rem;
  }

  [data-resource-clear][hidden] {
    display: none;
  }

  [data-resource-library] a:focus-visible,
  [data-resource-library] button:focus-visible,
  [data-resource-library] input:focus-visible,
  .blog-header_tabs:focus-visible,
  [fs-list-element="filters"] label:has(input:focus-visible),
  [data-resource-filter-group] label:has(input:focus-visible) {
    outline: 3px solid var(--base-color-brand--epm-red);
    outline-offset: 3px;
  }

  .blog_topic-tab,
  .blog_industry-tab,
  .blog_content-tab {
    scrollbar-color: var(--base-color-brand--epm-red) #eeeeee;
    scrollbar-gutter: stable;
    scrollbar-width: auto;
  }

  .blog_topic-tab::-webkit-scrollbar,
  .blog_industry-tab::-webkit-scrollbar,
  .blog_content-tab::-webkit-scrollbar {
    width: 0.75rem;
  }

  .blog_topic-tab::-webkit-scrollbar-track,
  .blog_industry-tab::-webkit-scrollbar-track,
  .blog_content-tab::-webkit-scrollbar-track {
    background: #eeeeee;
  }

  .blog_topic-tab::-webkit-scrollbar-thumb,
  .blog_industry-tab::-webkit-scrollbar-thumb,
  .blog_content-tab::-webkit-scrollbar-thumb {
    border: 0.2rem solid #eeeeee;
    border-radius: 999px;
    background: var(--base-color-brand--epm-red);
  }

  .blog-header_tabs[aria-selected="true"] .expand {
    font-size: 0;
  }

  .blog-header_tabs[aria-selected="true"] .expand::after {
    content: "−";
    font-size: 1rem;
  }

  @keyframes resource-skeleton {
    to {
      background-position-x: -200%;
    }
  }

  @media (max-width: 991px) {
    .static-resource-library_skeleton {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .static-resource-library_skeleton-card:nth-child(3) {
      display: none;
    }
  }

  @media (max-width: 767px) {
    .static-resource-library_skeleton {
      grid-template-columns: minmax(0, 1fr);
    }

    .static-resource-library_skeleton-card:nth-child(n + 2) {
      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .static-resource-library_skeleton-card {
      animation: none;
    }
  }
</style>

<div
  data-resource-library
  data-resource-endpoint="/resource-api-v2/api/resources"
  data-resource-fallback="https://cdn.prod.website-files.com/685d5960cbcc2c4cd8d6dced/6a5678f752d5bf81a626b8f6_resource-index.fallback.json"
>
  <div class="static-resource-library_search">
    <label for="resource-library-search">Search resources</label>
    <input
      id="resource-library-search"
      type="search"
      inputmode="search"
      autocomplete="off"
      placeholder="Search by title, topic, author, or industry"
      data-resource-search
    />
  </div>

  <div class="static-resource-library_status">
    <div aria-live="polite" aria-atomic="true" data-resource-count>
      Loading resources...
    </div>
    <button hidden disabled type="button" class="button" data-resource-clear>
      Clear filters
    </button>
  </div>

  <div class="sr-only" aria-live="polite" data-resource-announcement></div>

  <div data-resource-state="loading">
    <span class="sr-only">Loading resources…</span>
    <div aria-hidden="true" class="static-resource-library_skeleton">
      <div class="static-resource-library_skeleton-card"></div>
      <div class="static-resource-library_skeleton-card"></div>
      <div class="static-resource-library_skeleton-card"></div>
    </div>
  </div>

  <div
    role="list"
    class="collection-list w-dyn-items static-resource-library"
    data-resource-results
  ></div>

  <div hidden class="static-resource-library_empty" data-resource-state="empty">
    No resources match your search and filters.
  </div>

  <div hidden class="static-resource-library_error" data-resource-state="error">
    <p>We couldn’t load the Resource Hub.</p>
    <button type="button" class="button" data-resource-retry>TRY AGAIN</button>
  </div>

  <div hidden class="sr-only" data-resource-state="fallback">
    Showing the latest saved resource list.
  </div>

  <div class="static-resource-library_load">
    <button hidden type="button" class="button" data-resource-load-more>
      LOAD MORE
    </button>
  </div>

  <div hidden role="listitem" class="w-dyn-item" data-resource-template="card">
    <a data-resource-field="url" href="#" class="blog-post w-inline-block">
      <div class="blog-post_img-container" data-resource-field="image-container">
        <img
          data-resource-field="image"
          src=""
          alt=""
          width="640"
          height="360"
          class="_16x9_fill"
        />
      </div>

      <div class="blog-item-pill-holder" data-resource-list="pills">
        <div
          hidden
          class="blog-pill w-dyn-item"
          style="background-color: #444"
          data-resource-template="pill"
          data-resource-pill-group="content-type"
        >
          <span class="blog-pill_label" data-resource-field="label"></span>
        </div>
        <div
          hidden
          class="blog-pill w-dyn-item"
          style="background-color: #d3233a"
          data-resource-template="pill"
          data-resource-pill-group="topic"
        >
          <span class="blog-pill_label" data-resource-field="label"></span>
        </div>
        <div
          hidden
          class="blog-pill w-dyn-item"
          style="background-color: #8b1523"
          data-resource-template="pill"
          data-resource-pill-group="industry"
        >
          <span class="blog-pill_label" data-resource-field="label"></span>
        </div>
      </div>

      <div class="div-block-12">
        <div class="posted-date" data-resource-field="date"></div>
        <div class="posted-date" data-resource-field="author-separator">•</div>
        <div data-resource-list="authors">
          <span
            hidden
            class="author-blog-container w-dyn-item"
            data-resource-template="author"
          >
            <span class="posted-date" data-resource-field="label"></span>
          </span>
        </div>
      </div>

      <div class="spacer-xsmall"></div>
      <h2 class="heading-style-h5 blog-header" data-resource-field="title"></h2>
      <div class="spacer-small"></div>
      <div class="text-size-small" data-resource-field="summary"></div>
      <div class="spacer-tiny"></div>
      <div class="blog-post_line"></div>
      <div class="blog-post_link-container">
        <div class="blog-post_link" data-resource-field="cta">View resource</div>
        <img
          src="https://cdn.prod.website-files.com/685d5960cbcc2c4cd8d6dced/688a802efb559f040b708fbe_Arrow-right.svg"
          loading="lazy"
          alt=""
          class="image-5"
        />
      </div>
    </a>
  </div>
</div>

<script type="module" src="/resource-api-v2/static-resource-library-v2.js"></script>
